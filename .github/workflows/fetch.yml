name: Fetch Market Data
on:
  workflow_dispatch: {}        # Manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch.js
      - name: Check for new hourly data
        id: check_data
        run: git status --porcelain data/hourly/ | grep -q . && echo "has_new_data=true" >> $GITHUB_OUTPUT || echo "has_new_data=false" >> $GITHUB_OUTPUT
      - if: steps.check_data.outputs.has_new_data == 'true'
        run: node scripts/analyze.js
      - if: steps.check_data.outputs.has_new_data == 'true'
        run: node scripts/compute-arbitrage.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hourly/ data/public/
          git diff --cached --quiet || (git commit -m "data: $(date -u +%Y-%m-%dT%H:%M)Z" && git push)
      - name: Trigger pages deploy
        if: steps.check_data.outputs.has_new_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type=deploy-pages
