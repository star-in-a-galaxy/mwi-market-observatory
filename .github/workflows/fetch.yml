name: Fetch Market Data
on:
  workflow_dispatch: {}        # Manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data             # data branch holds data/
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Overlay code from main
        run: |
          git fetch origin main
          git checkout FETCH_HEAD -- scripts site package.json
          git reset
      - run: node scripts/fetch.js
      - run: node scripts/analyze.js
      - run: node scripts/compute-arbitrage.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: $(date -u +%Y-%m-%dT%H:%M)Z" && git push origin data)
      - name: Trigger pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type=deploy-pages
