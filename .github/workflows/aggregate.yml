name: Daily Aggregate
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data             # data branch holds data/
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Overlay code from main
        run: |
          git fetch origin main
          git checkout FETCH_HEAD -- scripts package.json
          git reset
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Aggregate and prune
        run: |
          git pull --rebase origin data || true
          node scripts/aggregate.js
          node scripts/prune.js
      - name: Publish yesterday's daily file to append-only daily branch
        run: |
          node scripts/publish-daily.js
          if git show-ref --verify --quiet refs/heads/daily; then
            git push origin refs/heads/daily:refs/heads/daily
            git push origin --tags
          fi
      - name: Squash data branch snapshot and push
        run: |
          node scripts/squash-data.js
          git push --force origin data
      - name: Trigger pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type=deploy-pages
